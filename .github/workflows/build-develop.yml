name: Build Depliants Manager Application (develop)

on:
  push:
    branches:
      - develop
    paths-ignore:
      - '*.md'
      - 'src/main/docker/**'
      - '.mvn/**'
      - '.gitattributes'
      - '.gitignore'
      - 'mvnw'
      - 'mvnw.cmd'
  # No paths-ignore here: "Maven Compile and Verify" is a required check on develop, and a PR that skipped it
  # (e.g. a Dependabot docker-compose bump) would never become mergeable.
  pull_request:
    branches:
      - develop

permissions:
  contents: read

jobs:
  maven-compile-verify:
    name: Maven Compile and Verify
    runs-on: ubuntu-latest
    steps:
      - name: Code Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '17'
          distribution: 'temurin'
          server-id: 'github'
          architecture: x64
          cache: maven

      - name: Maven Verify
        run: mvn --batch-mode clean verify